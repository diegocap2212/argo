# Workspace do monorepo NEO. Um `pnpm install` na raiz instala os 4 apps + os pacotes
# compartilhados — é o primeiro passo do ONBOARDING.md.
#
# POR QUE pnpm E NÃO npm workspaces: o hoisting do npm aninhava o rollup de um dos apps
# Vite e o npm derrubava o binário nativo da plataforma (npm#4828) no builder Linux da
# Vercel. O node_modules isolado do pnpm não faz esse hoisting, então o bug não tem como
# aparecer. Antes disso cada app tinha o próprio package-lock (5 lockfiles, 5 installs).
packages:
  - 'neo-hub'
  - 'locavia-dashboard'
  - 'maturitymodel'
  - 'nero-portal'
  - 'packages/*'

# Scripts de instalação (postinstall) — o pnpm bloqueia todos por padrão e exige
# aprovação explícita. Cada linha é uma decisão, não um "liberar tudo": só entram os
# que precisam baixar/linkar binário nativo ou gerar código para o build funcionar.
allowBuilds:
  esbuild: true # binário nativo da plataforma; sem ele o Vite não builda
  '@prisma/client': true # gera o client tipado a partir do schema
  '@prisma/engines': true # engines nativas do Prisma
  prisma: true # CLI (usada por db:push/seed)
  '@swc/core': true # binário nativo do compilador do Next
  sharp: true # binário nativo de imagem, usado pelo Next
  unrs-resolver: true # binário nativo do resolver do ESLint
  '@scarf/scarf': false # telemetria/analytics de terceiro; nada do build depende disso

# Overrides de SEGURANÇA em dependências TRANSITIVAS (2026-07-27).
#
# `pnpm audit` reportava 23 vulnerabilidades (10 high) — dado que o code review disse não ter
# conseguido obter e que ninguém estava olhando, embora o log do hourly-sync já o imprimisse a
# cada execução. Estes três são transitivos: nenhum app os declara, então não há package.json
# para bumpar — o caminho é forçar a resolução aqui.
#
# O QUE NÃO ESTÁ AQUI, e por quê:
#   · vite >=6.4.3 (`server.fs.deny` bypass em caminhos alternativos do Windows) — exige major
#     5→6 no maturitymodel e no neo-hub. É bypass do DEV SERVER, não afeta produção (o build é
#     estático), então não justifica um major de build tool sem ciclo de verificação próprio.
#   · react-router >=8.3.0 (CSRF em modo RSC) — exige major 6→8 no maturitymodel, que é
#     migração de rotas, não bump. O app não usa RSC.
# Ambos ficam registrados como decisão, não como esquecimento.
overrides:
  postcss: '>=8.5.12' # leitura arbitrária de arquivo / vazamento de informação
  sharp: '>=0.35.0' # herda CVE-2026-33327 do libvips
  # `brace-expansion: '>=5.0.8'` foi TENTADO e REVERTIDO em 2026-07-27: quebra o eslint.
  # `minimatch@3` (que o @eslint/config-array usa) espera a API v1 do pacote — com a v5 o
  # lint morre em `TypeError: expand is not a function`. O CVE é DoS por expansão sem limite,
  # numa dependência de DESENVOLVIMENTO alcançada só pelo eslint: o risco real é alguém rodar
  # lint sobre um glob malicioso na própria máquina. Trocar o lint do monorepo inteiro por
  # isso é pior que o problema. Sai quando o eslint subir o minimatch.
