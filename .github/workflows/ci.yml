name: CI

# Gate de qualidade em push/PR do monorepo NEO (4 apps + packages/*).
#
# UM `pnpm install` cobre tudo (pnpm workspaces — ver pnpm-workspace.yaml). Antes eram 4
# jobs com 4 `npm ci`, um por app, porque cada um tinha o próprio package-lock.
#
# pnpm vem por COREPACK (lê `packageManager` do package.json) em vez de uma action de
# terceiro — menos superfície de supply chain e uma peça a menos para manter.
#
# NUNCA rodar `npm run build` do Dash aqui: ele chama sync:sfmkt e exige credenciais do
# Jira/Salesforce. O build:portal usa `vite build` direto, sem sync.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Para o job e2e-portal, que verifica um DEPLOYMENT e não o código do commit:
  workflow_dispatch: # rodar à mão depois de promover
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC — pega gate que abriu sem ninguém notar

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  checks:
    name: Tipos, lint, contrato e builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — pinned por SHA (supply chain)
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 — pinned por SHA (supply chain)
        with:
          node-version: 24 # paridade com o runtime dos projetos Vercel (24.x)
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck (4 apps + packages)
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

      # Guarda as cópias autocontidas do HMAC (middleware.ts e api/session.ts): a Vercel não
      # deixa compartilhar módulo entre Edge Middleware/functions, então o contrato é testado.
      - name: Contrato de sessão (@neo/auth × middleware × api/session)
        run: pnpm --filter @neo/auth test

      - name: Testes de performance do Dash (lógica pura)
        run: pnpm --filter locavia-dashboard test:performance

      # Invariantes da FRONTEIRA do dado: `Resolved` só vem de `resolutiondate` do Jira,
      # lead time negativo não vira duração positiva, e a vazão do snapshot bate com a da
      # tendência semanal. Existia um fallback `Resolved = UpdatedAt` que inventava a data de
      # entrega E zerava a própria flag de higiene que deveria denunciá-lo — nenhum teste de
      # snapshot pegava, porque tudo continuava "passando".
      - name: Invariantes do sync do Dash (data de entrega não é inventada)
        run: pnpm --filter locavia-dashboard test:sync

      # Guarda a máquina de estados do ciclo, escrita duas vezes por imposição de runtime
      # (CYCLE_TRANSITIONS no TS × trigger cycle_transition_guard no Postgres). Divergir ali
      # faz a UI oferecer caminho que o banco recusa — e já custou um bug: `pre_session`
      # entrou no banco em 24/07 e ficou fora da jornada da home até 26/07.
      # Lê o SQL como texto: não precisa de banco, roda em qualquer runner.
      - name: Contrato da jornada do MMA (TS × SQL)
        run: pnpm --filter maturitymodel test:journey

      # Fórmulas das âncoras (normalização de issue do Jira). Nunca tiveram teste porque a
      # lógica vivia dentro da Edge Function, que lê `Deno.env` na carga do módulo — importar
      # quebrava. A métrica "sprint injetada" inferia adição comparando o COMPRIMENTO de duas
      # strings, e um número errado numa âncora tem a mesma cara de um número certo.
      - name: Fórmulas das âncoras do MMA (lógica pura)
        run: pnpm --filter maturitymodel test:anchors

      # As 51 migrations do MMA aplicadas num Postgres limpo (PGlite/WASM — sem Docker, sem
      # nuvem, sem credencial). Responde "esta migration roda?" antes de tocar em banco real.
      - name: Migrations do MMA aplicam em Postgres limpo
        run: pnpm --filter maturitymodel test:migrations

      # A matriz de papéis com RLS de verdade + o ensaio da migração de dados (todo AM por
      # squad tem de virar AM global, senão alguém perde acesso). Achou dois defeitos que
      # revisão de código não pegou: a ordem do CHECK de squad_members.role e o vazamento
      # do diretório de profiles por policy legada.
      - name: Papéis e jornada do MMA com RLS real
        run: pnpm --filter maturitymodel test:rls-local

      # Guarda a lista de modelos liberados, que vive em 3 lugares (allowlist, tabela de
      # preços, seletor do cliente). Divergir ali distorce o custo em silêncio — e custo
      # errado só aparece na fatura.
      - name: Modelos e preços do Nero (lógica pura)
        run: pnpm --filter nero-portal test:core

      - name: Build do portal (hub + dash + maturity, composto)
        run: pnpm build:portal

      - name: Build do Nero (Next, projeto Vercel separado)
        run: pnpm --filter nero-portal build
        env:
          # O build não toca o banco (todas as páginas são force-dynamic), mas o Prisma
          # exige a URL definida para gerar o client.
          POSTGRES_PRISMA_URL: postgres://user:pass@localhost:5432/db
          DATABASE_URL_UNPOOLED: postgres://user:pass@localhost:5432/db

  # NÃO roda em push/PR de propósito. Esta suíte afirma o estado de um DEPLOYMENT, e o deploy
  # aqui é por CLI (Git desconectado — ver HANDOFF): entre o merge e o deploy existe uma janela
  # em que main já tem os testes novos e produção ainda tem o código antigo. Rodando em push,
  # o CI ficaria vermelho nessa janela por motivo certo e conclusão errada, e o time aprenderia
  # a ignorar. Como gate pós-deploy + verificação diária, o vermelho sempre significa algo real:
  # uma porta que abriu.
  e2e-portal:
    name: E2E do portal (matriz de gate contra produção)
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — pinned por SHA (supply chain)
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 — pinned por SHA (supply chain)
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # SEM segredo de propósito: essa metade da suíte só verifica que porta fechada continua
      # fechada (302/401/400/405), o que não exige forjar cookie. É a checagem que vale rodar
      # continuamente contra produção — um gate que abriu por acidente aparece aqui.
      # A metade logada (cookie forjado) exige NEO_SESSION_SECRET e roda contra staging antes
      # de promover — ver ONBOARDING.md.
      - name: Matriz sem sessão
        run: pnpm run test:portal
        env:
          NEO_BASE_URL: https://neo-lm.vercel.app

  e2e-dash:
    name: E2E do Dash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — pinned por SHA (supply chain)
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 — pinned por SHA (supply chain)
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instala o navegador do Playwright
        run: pnpm --filter locavia-dashboard exec playwright install --with-deps chromium
      - name: E2E (fallback local de dados)
        run: pnpm --filter locavia-dashboard exec playwright test --project=chromium
        env:
          VITE_API_TARGET: ''

  # ══════════════════════════════════════════════════════════════════════════
  # SEGURANÇA DA CADEIA E DO CÓDIGO
  #
  # O review de 2026-07-27 (§9) listou como lacunas: sem SAST, sem secret scanning, sem
  # SCA/SBOM, sem Dependabot. E registrou que não conseguiu consultar CVEs — o ambiente
  # bloqueou o envio da árvore de dependências ao registry. Enquanto isso, o log do
  # `hourly-sync` reportava **8 vulnerabilidades (7 high)** a cada execução, num job que
  # carrega JIRA_API_TOKEN, BLOB_READ_WRITE_TOKEN e `contents: write` em main. O dado existia;
  # ninguém estava olhando.
  #
  # Jobs SEPARADOS do `checks` de propósito: falha de auditoria de dependência não deve
  # bloquear o merge de uma correção de bug, mas tem de ser visível. `continue-on-error` onde
  # a decisão é humana; falha real onde é objetiva (segredo commitado).
  # ══════════════════════════════════════════════════════════════════════════

  seguranca:
    name: SAST, segredos e dependências
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload do SARIF para a aba Security
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — pinned por SHA (supply chain)
        with:
          # gitleaks precisa do histórico: segredo commitado e removido depois continua no
          # histórico, e é exatamente o caso do repo (ver a anon key na migration do cron).
          fetch-depth: 0

      # ── Secret scanning ──
      # Falha o job de verdade: segredo em commit é objetivo, não opinião.
      #
      # `.gitleaks.toml` na raiz tem UMA allowlist, por caminho: a anon key (pública) na
      # migration do cron antigo, que está no histórico imutável. Sem ela este job ficaria
      # vermelho para sempre, e vermelho permanente é o treinamento para ignorar o vermelho.
      # Ver o arquivo — ele explica por que aquilo deixou de ser risco.
      - name: gitleaks (segredos no código e no histórico)
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7 — pinned por SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 — pinned por SHA
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── SCA: vulnerabilidades conhecidas nas dependências ──
      # `continue-on-error`: um CVE novo em dependência transitiva aparece do nada e não pode
      # travar o merge de uma correção urgente. O resumo vai para o Job Summary, que fica
      # visível no PR sem exigir que alguém abra o log.
      - name: pnpm audit (SCA)
        id: audit
        continue-on-error: true
        run: |
          echo '## Auditoria de dependências (`pnpm audit`)' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if pnpm audit --audit-level=high --json > audit.json 2>/dev/null; then
            echo '✅ Nenhuma vulnerabilidade high/critical.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '⚠️ Vulnerabilidades high/critical encontradas:' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            pnpm audit --audit-level=high 2>&1 | head -60 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── SBOM ──
      # Inventário do que de fato foi instalado. Serve para responder "estamos expostos a X?"
      # sem ter que reproduzir o ambiente — e é o que faltava quando o review não conseguiu
      # consultar CVEs.
      - name: SBOM (CycloneDX)
        continue-on-error: true
        run: pnpm dlx @cyclonedx/cyclonedx-npm@latest --output-file sbom.json --output-format json || true

      - name: Publica SBOM e auditoria como artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 — pinned por SHA
        with:
          name: sbom-e-auditoria
          path: |
            sbom.json
            audit.json
          if-no-files-found: warn
          retention-days: 30

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # `security-events: write` saiu com o upload: sem GHAS não há onde publicar
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 — pinned por SHA
      - name: Inicializa CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4 — pinned por SHA
        with:
          languages: javascript-typescript
          # `security-and-quality` inclui as regras de qualidade além das de segurança. Vale a
          # pena aqui: boa parte dos achados do review era invariante mal expressa, não CVE.
          queries: security-and-quality
      # `upload: false` NÃO é para silenciar o job — é porque o upload EXIGE Code Scanning
      # habilitado, e Code Scanning em repositório PRIVADO exige GitHub Advanced Security
      # (pago). Sem GHAS o passo de upload responde 403 ("Code scanning is not enabled for
      # this repository") e derruba a `main` mesmo tendo a análise passado: na primeira
      # execução real o CodeQL varreu 290/290 arquivos TS e 10/10 JS e gerou o SARIF — só não
      # conseguiu publicar.
      #
      # Então o resultado é consumido AQUI, do arquivo, em vez de na aba Security. Perde-se a
      # UI, o histórico entre execuções e o triage; NÃO se perde o gate: achado novo pinta a
      # `main` de vermelho e imprime regra, arquivo e linha no log.
      #
      # Se um dia houver GHAS: trocar por `upload: true`, remover o passo abaixo e apagar este
      # comentário. Enquanto não houver, `upload: true` é pior que inútil — é vermelho
      # permanente que treina o time a ignorar CI vermelho.
      - name: Analisa
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.4 — pinned por SHA
        with:
          category: /language:javascript-typescript
          upload: false
          output: codeql-results

      - name: Falha se o CodeQL achou algo
        run: |
          set -euo pipefail
          shopt -s nullglob
          arquivos=(codeql-results/*.sarif)
          if [ ${#arquivos[@]} -eq 0 ]; then
            echo "::error::nenhum SARIF gerado — a análise não rodou, e um job de SAST que não" \
                 "analisa nada não pode passar."
            exit 1
          fi
          total=0
          for f in "${arquivos[@]}"; do
            n=$(jq '[.runs[].results[]?] | length' "$f")
            total=$((total + n))
            if [ "$n" -gt 0 ]; then
              echo "── $n achado(s) em $f"
              jq -r '.runs[].results[]? |
                "  [\(.level // "warning")] \(.ruleId)\n    \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine // 0)\n    \(.message.text)"' "$f"
            fi
          done
          if [ "$total" -gt 0 ]; then
            echo "::error::CodeQL: $total achado(s). Detalhe acima (sem aba Security: repo privado sem GHAS)."
            exit 1
          fi
          echo "✅ CodeQL: 0 achados em ${#arquivos[@]} arquivo(s) SARIF."

      - name: Guarda o SARIF como artefato
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 — pinned por SHA
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30
